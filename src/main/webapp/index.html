<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Sistema de Cadastro</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f4f6f9; }
        .card-custom { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: none; }
        .header-title { color: #2c3e50; font-weight: 600; }
    </style>
</h:head>

<h:body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-custom p-4">
                    <div class="text-center mb-4">
                        <h2 class="header-title">Novo Cliente</h2>
                        <p class="text-muted">Preencha os dados abaixo</p>
                    </div>

                    <h:messages globalOnly="true" 
                                styleClass="alert" 
                                errorClass="alert alert-danger" 
                                infoClass="alert alert-success" 
                                style="list-style:none; margin:0; padding:10px;"/>

                    <h:form id="formCliente" styleClass="mt-3">
                        
                        <div class="mb-3">
                            <h:outputLabel value="Nome Completo" for="nome" styleClass="form-label fw-bold"/>
                            <h:inputText id="nome" value="#{clienteController.cliente.nome}" 
                                         required="true" 
                                         requiredMessage="O nome é obrigatório"
                                         styleClass="form-control" />
                            <h:message for="nome" style="color:red; font-size:0.875em;"/>
                        </div>

                        <div class="mb-3">
                            <h:outputLabel value="Endereço de Email" for="email" styleClass="form-label fw-bold"/>
                            <h:inputText id="email" value="#{clienteController.cliente.email}" 
                                         required="true" 
                                         requiredMessage="O email é obrigatório"
                                         styleClass="form-control" />
                            <h:message for="email" style="color:red; font-size:0.875em;"/>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <h:commandButton value="Cadastrar Cliente" 
                                             action="#{clienteController.salvar}" 
                                             styleClass="btn btn-primary btn-lg"/>
                        </div>

                    </h:form>
                </div>
            </div>
        </div>
    </div>

</h:body>
</html>
